<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- ============ YouTube Playables SDK ============
     Before submitting to Playables: paste the SDK script element from the
     Playables developer portal here, UNCOMMENTED. It MUST load before the
     game script below. With the SDK absent the game runs standalone
     (localStorage saves, normal audio) with zero behavior change. -->
<!-- SDK_SRC_PLACEHOLDER -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Star Strike — Arcade Space Shooter</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070f; font-family:-apple-system,'Helvetica Neue',Arial,sans-serif; }
  #game { position:fixed; inset:0; touch-action:none; display:block; cursor:crosshair; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center;
         padding:calc(10px + env(safe-area-inset-top)) 14px 10px; pointer-events:none; z-index:5; }
  .pill { background:rgba(0,0,0,.55); color:#fff; font-weight:800; font-size:15px; padding:8px 14px;
          border-radius:999px; border:1px solid rgba(255,255,255,.15); white-space:nowrap; }
  .pill .gold { color:#ffd34d; }
  #muteBtn { pointer-events:auto; cursor:pointer; user-select:none; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:10;
             background:rgba(0,0,0,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .card { background:#141a2e; border-radius:20px; padding:28px 26px; margin:20px; max-width:340px; width:100%;
          text-align:center; color:#fff; box-shadow:0 20px 60px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.08); }
  .card h1 { font-size:30px; margin-bottom:6px; letter-spacing:1px; }
  .card h1 .cyan { color:#4de1ff; } .card h1 .magenta { color:#ff5bd7; }
  .card p { font-size:14px; color:#aeb6c2; line-height:1.55; margin-bottom:18px; }
  .card p b { color:#fff; }
  .btn { display:inline-block; background:linear-gradient(180deg,#37e0ff,#1899d6); color:#04283a; font-weight:800;
         font-size:18px; padding:14px 46px; border-radius:14px; border:none; cursor:pointer;
         box-shadow:0 6px 0 #0e6d99, 0 10px 24px rgba(0,0,0,.4); font-family:inherit; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #0e6d99; }
  .hidden { display:none !important; }
  .stat { font-size:15px; color:#aeb6c2; margin-bottom:4px; }
  .stat b { color:#ffd34d; font-size:20px; }
  .keys { font-size:12px; color:#7c8592; margin-top:14px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="pill">SCORE <span class="gold" id="scoreV">0</span></div>
  <div class="pill" id="hpPill">&#10084;&#10084;&#10084;</div>
  <div style="display:flex;gap:8px;pointer-events:auto">
    <div class="pill" id="wavePill">WAVE 1</div>
    <div class="pill" id="muteBtn">&#x1F50A;</div>
  </div>
</div>

<div class="overlay" id="startOv">
  <div class="card">
    <h1><span class="cyan">STAR</span> <span class="magenta">STRIKE</span></h1>
    <p><b>Drag</b> to fly your ship — guns fire automatically.<br>Blast <b style="color:#7dff8a">aliens</b>, <b style="color:#ff8a8a">alien ships</b> and <b style="color:#c9c9c9">asteroids</b>.<br>Dodge their fire. Survive the waves!</p>
    <button class="btn" id="playBtn">LAUNCH</button>
    <div class="keys">Prototype v0.1 — arrows / WASD work on desktop too</div>
  </div>
</div>

<div class="overlay hidden" id="overOv">
  <div class="card">
    <h1>&#128165; Ship down!</h1>
    <p class="stat">Score: <b id="finalScore">0</b></p>
    <p class="stat">Best: <b id="bestScore">0</b></p>
    <button class="btn" id="retryBtn">RETRY</button>
  </div>
</div>

<script>
'use strict';
/* ================= setup ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G) { G.px = clamp(G.px, 30, W - 30); G.py = clamp(G.py, H * 0.3, H - 60); }
}
window.addEventListener('resize', resize);

/* ================= utils ================= */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

/* ================= audio (tiny synth) ================= */
let AC = null, muted = false;
function audio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, when) {
  if (muted || YT.audioLocked) return;
  try {
    const ac = audio(), t = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) { /* audio unavailable */ }
}
const sfx = {
  shoot() { tone(880, .08, 'square', .045, 440); },
  boom()  { tone(160, .25, 'sawtooth', .12, 40); tone(90, .3, 'triangle', .1, 30, .02); },
  hit()   { tone(220, .2, 'sawtooth', .14, 70); },
  wave()  { tone(523, .1, 'triangle', .09); tone(784, .14, 'triangle', .09, 0, .09); },
  over()  { [400, 300, 210, 140].forEach((f, i) => tone(f, .18, 'sawtooth', .09, 0, i * .11)); },
  click() { tone(620, .05, 'square', .06); }
};
document.getElementById('muteBtn').addEventListener('click', () => {
  muted = !muted;
  document.getElementById('muteBtn').innerHTML = muted ? '&#x1F507;' : '&#x1F50A;';
});

/* ================= YouTube Playables SDK adapter ================= */
const YT = {
  _inited: false,
  firstFrameSent: false,
  gameReadySent: false,
  paused: false,
  audioLocked: false,
  get sdk() {
    try {
      return (typeof ytgame !== 'undefined' && ytgame && ytgame.IN_PLAYABLES_ENV) ? ytgame : null;
    } catch (e) { return null; }
  },
  init() {
    if (this._inited) return;
    this._inited = true;
    const s = this.sdk;
    if (!s) return;
    try {
      s.system.onPause(() => { this.paused = true; persistBest(); });
      s.system.onResume(() => { this.paused = false; });
      this.audioLocked = !s.system.isAudioEnabled();
      s.system.onAudioEnabledChange((on) => { this.audioLocked = !on; });
      this.loadCloud();
    } catch (e) {}
  },
  firstFrame() {
    if (this.firstFrameSent) return;
    this.firstFrameSent = true;
    try { if (this.sdk) this.sdk.game.firstFrameReady(); } catch (e) {}
  },
  ready() {
    if (this.gameReadySent) return;
    this.gameReadySent = true;
    try { if (this.sdk) this.sdk.game.gameReady(); } catch (e) {}
  },
  sendScore(v) {
    const s = this.sdk;
    if (!s) return;
    try {
      const p = s.engagement.sendScore({ value: Math.floor(v) });
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  },
  async loadCloud() {
    const s = this.sdk;
    if (!s) return;
    try {
      const raw = await s.game.loadData();
      if (raw) {
        const d = JSON.parse(raw);
        if (d && typeof d.best === 'number' && d.best > G.best) {
          G.best = Math.floor(d.best);
          updateHUD();
        }
      }
    } catch (e) {}
  }
};

/* ================= input ================= */
let pointerDown = false;
function setTarget(clientX, clientY) {
  G.targetX = clamp(clientX, 30, W - 30);
  G.targetY = clamp(clientY, H * 0.25, H - 60);
}
canvas.addEventListener('pointerdown', e => {
  if (YT.paused) return;
  pointerDown = true; setTarget(e.clientX, e.clientY);
  try { audio(); } catch (err) {}
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => { if (pointerDown && !YT.paused) setTarget(e.clientX, e.clientY); });
canvas.addEventListener('pointerup', () => { pointerDown = false; });
canvas.addEventListener('pointercancel', () => { pointerDown = false; });
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

/* ================= game state ================= */
const G = {
  state: 'menu',            // menu | play | over
  score: 0, best: parseInt(localStorage.getItem('ss_best') || '0', 10) || 0,
  hp: 3, invuln: 0,
  px: 0, py: 0, targetX: 0, targetY: 0,
  bullets: [], ebullets: [], enemies: [], rocks: [],
  particles: [], floats: [], stars: [],
  fireCd: 0, spawnT: 1.2, rockT: 2.5,
  wave: 1, waveT: 0, time: 0, shake: 0,
};
function initStars() {
  G.stars.length = 0;
  const n = Math.floor(W * H / 9000);
  for (let i = 0; i < n; i++)
    G.stars.push({ x: rnd(0, W), y: rnd(0, H), z: rnd(0.25, 1) });
}
function resetGame() {
  G.score = 0; G.hp = 3; G.invuln = 0;
  G.bullets.length = 0; G.ebullets.length = 0;
  G.enemies.length = 0; G.rocks.length = 0;
  G.particles.length = 0; G.floats.length = 0;
  G.px = W / 2; G.py = H * 0.78;
  G.targetX = G.px; G.targetY = G.py;
  G.fireCd = 0.3; G.spawnT = 1.0; G.rockT = 2.0;
  G.wave = 1; G.waveT = 0; G.shake = 0; G.time = 0;
  updateHUD();
}

/* ================= spawning ================= */
function spawnEnemy() {
  const wv = G.wave;
  const r = Math.random();
  const x = rnd(40, W - 40);
  if (r < 0.45) {
    // alien drone: drifts down, wobbles, 1 hp
    G.enemies.push({ kind: 'drone', x: x, y: -30, hp: 1, t: rnd(0, 6),
                     vy: rnd(70, 110) + wv * 7, r: 16, score: 10 });
  } else if (r < 0.8) {
    // alien spaceship: sine path, shoots back, 2 hp
    G.enemies.push({ kind: 'ship', x: x, y: -36, hp: 2, t: rnd(0, 6),
                     vy: rnd(55, 85) + wv * 5, r: 20, score: 25,
                     fireT: rnd(1.2, 2.4), baseX: x, amp: rnd(40, 110) });
  } else {
    // kamikaze saucer: dives at the player, 1 hp
    G.enemies.push({ kind: 'dart', x: x, y: -30, hp: 1, t: 0,
                     vy: rnd(150, 200) + wv * 10, r: 14, score: 20 });
  }
}
function makeRock(x, y, r) {
  const verts = [];
  const n = 9;
  for (let i = 0; i < n; i++) verts.push(rnd(0.72, 1.15));
  return { x: x, y: y, vx: rnd(-40, 40), vy: rnd(50, 110),
           rot: rnd(0, 6.28), vr: rnd(-1.6, 1.6), r: r, hp: r > 26 ? 3 : 1,
           verts: verts, score: r > 26 ? 15 : 5 };
}
function spawnRock() {
  G.rocks.push(makeRock(rnd(30, W - 30), -50, rnd(28, 44)));
}

/* ================= effects ================= */
function burst(x, y, n, color, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(40, spd || 260);
    G.particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                       life: rnd(.35, .8), max: .8, color: color, size: rnd(2, 5) });
  }
}
function spawnFloat(x, y, txt, color) {
  G.floats.push({ x: x, y: y, txt: txt, color: color, t: 0 });
}
function explode(x, y, color, big) {
  burst(x, y, big ? 26 : 14, color);
  burst(x, y, big ? 10 : 5, '#ffffff', 160);
  G.shake = Math.max(G.shake, big ? 0.7 : 0.35);
  sfx.boom();
}

/* ================= combat ================= */
function damageEnemy(e, dmg) {
  e.hp -= dmg;
  if (e.hp <= 0) {
    e.dead = true;
    G.score += e.score;
    spawnFloat(e.x, e.y, '+' + e.score, '#ffd34d');
    explode(e.x, e.y, e.kind === 'drone' ? '#7dff8a' : '#ff5b8a', e.kind !== 'dart');
    updateHUD();
  } else {
    burst(e.x, e.y, 4, '#ffffff', 140);
  }
}
function damageRock(rk, dmg) {
  rk.hp -= dmg;
  if (rk.hp <= 0) {
    rk.dead = true;
    G.score += rk.score;
    spawnFloat(rk.x, rk.y, '+' + rk.score, '#ffd34d');
    explode(rk.x, rk.y, '#b9b9c9', rk.r > 26);
    if (rk.r > 26) {
      // big asteroid splits into two small ones
      for (let i = 0; i < 2; i++) {
        const s = makeRock(rk.x + rnd(-14, 14), rk.y + rnd(-10, 10), rnd(13, 18));
        s.vx = rnd(-90, 90); s.vy = rnd(90, 160);
        G.rocks.push(s);
      }
    }
    updateHUD();
  } else {
    burst(rk.x, rk.y, 4, '#ffffff', 140);
  }
}
function hurtPlayer() {
  if (G.invuln > 0 || G.state !== 'play') return;
  G.hp--;
  G.invuln = 1.6;
  G.shake = 0.9;
  sfx.hit();
  burst(G.px, G.py, 22, '#4de1ff');
  updateHUD();
  if (G.hp <= 0) gameOver();
}
function gameOver() {
  if (G.state !== 'play') return;
  G.state = 'over';
  explode(G.px, G.py, '#4de1ff', true);
  sfx.over();
  const isBest = G.score > G.best;
  if (isBest) G.best = G.score;
  persistBest();
  YT.sendScore(G.best);
  document.getElementById('finalScore').textContent = G.score;
  document.getElementById('bestScore').textContent = G.best + (isBest ? '  ★ new!' : '');
  updateHUD();
  setTimeout(() => document.getElementById('overOv').classList.remove('hidden'), 700);
}

/* ================= update ================= */
function update(dt) {
  if (YT.paused) return;
  G.time += dt;
  // starfield always scrolls
  for (const s of G.stars) {
    s.y += (18 + s.z * 90) * dt;
    if (s.y > H + 4) { s.y = -4; s.x = rnd(0, W); }
  }
  // particles & floats always animate
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - 1.6 * dt); p.vy *= (1 - 1.6 * dt);
    p.life -= dt;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.floats.length - 1; i >= 0; i--) {
    const f = G.floats[i]; f.t += dt; f.y -= 46 * dt;
    if (f.t > 1.1) G.floats.splice(i, 1);
  }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 2.4);
  if (G.invuln > 0) G.invuln -= dt;

  if (G.state !== 'play') return;

  // wave timer: new wave every 30s
  G.waveT += dt;
  if (G.waveT >= 30) {
    G.waveT = 0; G.wave++;
    sfx.wave();
    spawnFloat(W / 2, H * 0.4, 'WAVE ' + G.wave, '#4de1ff');
    updateHUD();
  }

  // player movement: drag target + keyboard
  const kspd = 420 * dt;
  if (keys['arrowleft'] || keys['a']) G.targetX -= kspd;
  if (keys['arrowright'] || keys['d']) G.targetX += kspd;
  if (keys['arrowup'] || keys['w']) G.targetY -= kspd;
  if (keys['arrowdown'] || keys['s']) G.targetY += kspd;
  G.targetX = clamp(G.targetX, 30, W - 30);
  G.targetY = clamp(G.targetY, H * 0.25, H - 60);
  const f = Math.min(1, dt * 14);
  G.px += (G.targetX - G.px) * f;
  G.py += (G.targetY - G.py) * f;

  // auto-fire
  G.fireCd -= dt;
  if (G.fireCd <= 0) {
    G.fireCd = 0.17;
    G.bullets.push({ x: G.px - 9, y: G.py - 24, vy: -920, r: 4 });
    G.bullets.push({ x: G.px + 9, y: G.py - 24, vy: -920, r: 4 });
    sfx.shoot();
  }

  // spawners
  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    G.spawnT = clamp(1.15 - G.wave * 0.08, 0.38, 1.15) * rnd(0.7, 1.3);
    spawnEnemy();
  }
  G.rockT -= dt;
  if (G.rockT <= 0) {
    G.rockT = clamp(3.4 - G.wave * 0.18, 1.4, 3.4) * rnd(0.7, 1.3);
    spawnRock();
  }

  // bullets
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.y += b.vy * dt;
    if (b.y < -20) { G.bullets.splice(i, 1); continue; }
    let hit = false;
    for (const e of G.enemies) {
      if (!e.dead && dist2(b.x, b.y, e.x, e.y) < (b.r + e.r) * (b.r + e.r)) {
        damageEnemy(e, 1); hit = true; break;
      }
    }
    if (!hit) for (const rk of G.rocks) {
      if (!rk.dead && dist2(b.x, b.y, rk.x, rk.y) < (b.r + rk.r) * (b.r + rk.r)) {
        damageRock(rk, 1); hit = true; break;
      }
    }
    if (hit) G.bullets.splice(i, 1);
  }
  for (let i = G.enemies.length - 1; i >= 0; i--) if (G.enemies[i].dead) G.enemies.splice(i, 1);
  for (let i = G.rocks.length - 1; i >= 0; i--) if (G.rocks[i].dead) G.rocks.splice(i, 1);

  // enemies
  for (const e of G.enemies) {
    e.t += dt;
    if (e.kind === 'drone') {
      e.y += e.vy * dt;
      e.x += Math.sin(e.t * 3) * 30 * dt;
    } else if (e.kind === 'ship') {
      e.y += e.vy * dt;
      if (e.y > 110) e.x = e.baseX + Math.sin(e.t * 2.2) * e.amp;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 0 && e.y < H * 0.6) {
        e.fireT = rnd(1.4, 2.6) - Math.min(G.wave * 0.06, 0.5);
        const dx = clamp((G.px - e.x) * 0.6, -120, 120);
        G.ebullets.push({ x: e.x, y: e.y + 18, vx: dx, vy: 330, r: 5 });
        tone(300, .12, 'square', .05, 150);
      }
    } else { // dart: homes toward the player
      const dx = G.px - e.x, dy = G.py - e.y;
      const d = Math.hypot(dx, dy) || 1;
      e.x += (dx / d) * e.vy * dt;
      e.y += (dy / d) * e.vy * dt * 0.9 + 40 * dt;
    }
    e.x = clamp(e.x, 20, W - 20);
    // player collision
    if (dist2(e.x, e.y, G.px, G.py) < (e.r + 14) * (e.r + 14)) {
      damageEnemy(e, 99);
      hurtPlayer();
    }
  }
  for (let i = G.enemies.length - 1; i >= 0; i--)
    if (G.enemies[i].y > H + 60) G.enemies.splice(i, 1);

  // asteroids
  for (const rk of G.rocks) {
    rk.x += rk.vx * dt; rk.y += rk.vy * dt; rk.rot += rk.vr * dt;
    if (rk.x < -60) rk.x = W + 50; if (rk.x > W + 60) rk.x = -50;
    if (dist2(rk.x, rk.y, G.px, G.py) < (rk.r + 13) * (rk.r + 13)) {
      damageRock(rk, 99);
      hurtPlayer();
    }
  }
  for (let i = G.rocks.length - 1; i >= 0; i--)
    if (G.rocks[i].y > H + 70) G.rocks.splice(i, 1);

  // enemy bullets
  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const b = G.ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 20 || b.x < -20 || b.x > W + 20) { G.ebullets.splice(i, 1); continue; }
    if (dist2(b.x, b.y, G.px, G.py) < (b.r + 13) * (b.r + 13)) {
      G.ebullets.splice(i, 1);
      hurtPlayer();
    }
  }
}

/* ================= rendering ================= */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04060d'); g.addColorStop(0.6, '#0a1030'); g.addColorStop(1, '#131a3d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // nebula blobs
  ctx.globalAlpha = 0.5;
  let ng = ctx.createRadialGradient(W * 0.2, H * 0.25, 10, W * 0.2, H * 0.25, W * 0.5);
  ng.addColorStop(0, 'rgba(90,40,160,0.25)'); ng.addColorStop(1, 'rgba(90,40,160,0)');
  ctx.fillStyle = ng; ctx.fillRect(0, 0, W, H);
  ng = ctx.createRadialGradient(W * 0.85, H * 0.6, 10, W * 0.85, H * 0.6, W * 0.45);
  ng.addColorStop(0, 'rgba(20,120,180,0.20)'); ng.addColorStop(1, 'rgba(20,120,180,0)');
  ctx.fillStyle = ng; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  // stars
  for (const s of G.stars) {
    ctx.globalAlpha = 0.35 + s.z * 0.65;
    ctx.fillStyle = '#ffffff';
    const sz = s.z * 2.2;
    ctx.fillRect(s.x, s.y, sz, sz * 2.2);
  }
  ctx.globalAlpha = 1;
}
function drawPlayer() {
  if (G.state === 'over') return;
  if (G.invuln > 0 && Math.floor(G.time * 12) % 2 === 0) return; // hit blink
  const x = G.px, y = G.py;
  ctx.save();
  ctx.translate(x, y);
  const tilt = clamp((G.targetX - G.px) * 0.02, -0.35, 0.35);
  ctx.rotate(tilt);
  // engine flame
  const fl = 14 + Math.sin(G.time * 40) * 5;
  ctx.fillStyle = '#ff9d2e';
  ctx.beginPath(); ctx.moveTo(-7, 14); ctx.lineTo(7, 14); ctx.lineTo(0, 14 + fl); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe36e';
  ctx.beginPath(); ctx.moveTo(-4, 14); ctx.lineTo(4, 14); ctx.lineTo(0, 14 + fl * 0.55); ctx.closePath(); ctx.fill();
  // hull
  ctx.fillStyle = '#2f9dff';
  ctx.beginPath();
  ctx.moveTo(0, -24); ctx.lineTo(9, -6); ctx.lineTo(20, 10); ctx.lineTo(9, 14);
  ctx.lineTo(-9, 14); ctx.lineTo(-20, 10); ctx.lineTo(-9, -6);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0e4d80'; ctx.lineWidth = 2; ctx.stroke();
  // cockpit
  ctx.fillStyle = '#bfe9ff';
  ctx.beginPath(); ctx.ellipse(0, -6, 4.5, 8, 0, 0, Math.PI * 2); ctx.fill();
  // wing lights
  ctx.fillStyle = '#ff5b5b';
  ctx.beginPath(); ctx.arc(-20, 10, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7dff8a';
  ctx.beginPath(); ctx.arc(20, 10, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawDrone(e) {
  const x = e.x, y = e.y, wob = Math.sin(e.t * 6) * 2;
  ctx.save(); ctx.translate(x, y + wob);
  // tentacles
  ctx.strokeStyle = '#3fae4e'; ctx.lineWidth = 3;
  for (const a of [-0.5, 0, 0.5]) {
    ctx.beginPath(); ctx.moveTo(a * 10, 8);
    ctx.quadraticCurveTo(a * 14, 16, a * 10 + Math.sin(e.t * 8 + a * 5) * 4, 22);
    ctx.stroke();
  }
  // body
  ctx.fillStyle = '#58d668';
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2c7a38'; ctx.lineWidth = 2; ctx.stroke();
  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-6, -2, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -2, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  const px = clamp((G.px - e.x) * 0.01, -2, 2);
  ctx.beginPath(); ctx.arc(-6 + px, -2, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(6 + px, -2, 2.4, 0, Math.PI * 2); ctx.fill();
  // antennae
  ctx.strokeStyle = '#2c7a38'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-5, -11); ctx.lineTo(-8, -19); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5, -11); ctx.lineTo(8, -19); ctx.stroke();
  ctx.fillStyle = '#ffe36e';
  ctx.beginPath(); ctx.arc(-8, -20, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -20, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawAlienShip(e) {
  const x = e.x, y = e.y;
  ctx.save(); ctx.translate(x, y);
  // glow
  ctx.fillStyle = 'rgba(255,60,120,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 4, 26, 12, 0, 0, Math.PI * 2); ctx.fill();
  // saucer
  ctx.fillStyle = '#8a2be2';
  ctx.beginPath(); ctx.ellipse(0, 4, 22, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#4d1480'; ctx.lineWidth = 2; ctx.stroke();
  // dome
  ctx.fillStyle = 'rgba(180,240,255,0.9)';
  ctx.beginPath(); ctx.arc(0, -2, 9, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#4d1480'; ctx.stroke();
  // pilot silhouette
  ctx.fillStyle = '#2c7a38';
  ctx.beginPath(); ctx.arc(0, -6, 4, 0, Math.PI * 2); ctx.fill();
  // rim lights
  ctx.fillStyle = '#ffd34d';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.arc(i * 13, 4, 2.4 + Math.sin(e.t * 10 + i) * 1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawDart(e) {
  const x = e.x, y = e.y;
  const ang = Math.atan2(G.py - e.y, G.px - e.x) - Math.PI / 2;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang * 0.25);
  ctx.fillStyle = '#ff7b3d';
  ctx.beginPath();
  ctx.moveTo(0, -16); ctx.lineTo(11, 8); ctx.lineTo(0, 3); ctx.lineTo(-11, 8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#8a3d10'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, -4, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c00';
  ctx.beginPath(); ctx.arc(0, -4, 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawRock(rk) {
  ctx.save(); ctx.translate(rk.x, rk.y); ctx.rotate(rk.rot);
  ctx.fillStyle = '#8d8d9e';
  ctx.beginPath();
  const n = rk.verts.length;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rr = rk.r * rk.verts[i % n];
    if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#55555f'; ctx.lineWidth = 2.5; ctx.stroke();
  // craters
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.arc(-rk.r * 0.3, -rk.r * 0.2, rk.r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(rk.r * 0.35, rk.r * 0.3, rk.r * 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function render() {
  ctx.save();
  if (G.shake > 0)
    ctx.translate(rnd(-1, 1) * G.shake * 12, rnd(-1, 1) * G.shake * 12);
  drawBackground();
  for (const rk of G.rocks) drawRock(rk);
  for (const e of G.enemies) {
    if (e.kind === 'drone') drawDrone(e);
    else if (e.kind === 'ship') drawAlienShip(e);
    else drawDart(e);
  }
  // enemy bullets
  for (const b of G.ebullets) {
    ctx.fillStyle = '#ff4d6e';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,77,110,0.35)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2, 0, Math.PI * 2); ctx.fill();
  }
  drawPlayer();
  // player bullets
  for (const b of G.bullets) {
    ctx.fillStyle = '#aef3ff';
    ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r * 0.8, b.r * 2.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4de1ff';
    ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r * 0.45, b.r * 1.3, 0, 0, Math.PI * 2); ctx.fill();
  }
  // particles
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // floating texts
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const fl of G.floats) {
    const fs = 20 * (1 + (1 - fl.t / 1.1) * 0.25);
    ctx.globalAlpha = clamp(1 - fl.t / 1.1, 0, 1);
    ctx.font = '800 ' + fs + 'px -apple-system, Arial';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(fl.txt, fl.x, fl.y);
    ctx.fillStyle = fl.color; ctx.fillText(fl.txt, fl.x, fl.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ================= HUD & flow ================= */
function updateHUD() {
  document.getElementById('scoreV').textContent = G.score;
  document.getElementById('wavePill').textContent = 'WAVE ' + G.wave;
  let hearts = '';
  for (let i = 0; i < 3; i++) hearts += i < G.hp ? '&#10084;' : '<span style="opacity:.25">&#10084;</span>';
  document.getElementById('hpPill').innerHTML = hearts;
}
function persistBest() {
  try { localStorage.setItem('ss_best', String(G.best)); } catch (e) {}
  const s = YT.sdk;
  if (s) {
    try {
      const p = s.game.saveData(JSON.stringify({ best: G.best, v: 1 }));
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
}
function startGame() {
  sfx.click();
  YT.init();
  YT.ready();
  resetGame();
  G.state = 'play';
  document.getElementById('startOv').classList.add('hidden');
  document.getElementById('overOv').classList.add('hidden');
}
document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

/* ================= main loop ================= */
resize();
initStars();
resetGame();
G.state = 'menu';
YT.init();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);
  update(dt);
  render();
  YT.firstFrame();
}
requestAnimationFrame(frame);
</script>
</body>
